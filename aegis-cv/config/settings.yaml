# AEGIS Core Configuration
# Hardware, sensing, and performance thresholds

hardware:
  device: "ICAM-540"  # or MIC-733
  quantization: "INT8"  # TensorRT quantization level
  compute_capability: "sm_72"  # NVIDIA GPU architecture

vision:
  model_pose: "yolov8n-pose"  # Hand gesture detection model
  model_detect: "yolov8n"     # Bin geofencing detection model
  model_custom: "models/custom/grab_pose.pt"  # Fine-tuned gesture model
  confidence_threshold: 0.6
  iou_threshold: 0.45

sensing:
  modbus:
    ip_address: "192.168.1.100"
    port: 502
    slave_id: 1
    
    # ADAM-6117 Weight Module Registers
    registers:
      bin_0_0_weight: 100
      bin_0_1_weight: 101
      bin_0_2_weight: 102
      bin_0_3_weight: 103
      bin_1_0_weight: 104
      bin_1_1_weight: 105
      bin_1_2_weight: 106
      bin_1_3_weight: 107
    
    # Weight change sensitivity (grams)
    weight_delta_threshold: 50
  
  serial:
    port: "COM3"
    baudrate: 115200
    timeout: 1.0

fsm:
  # Triple-Gate Verification Loop timeouts
  gate1_spatial_timeout: 2.0  # seconds - hand must stay in bin
  gate2_intent_timeout: 1.5   # seconds - fist detection window
  gate3_verification_timeout: 3.0  # seconds - weight confirmation
  
  # Error thresholds
  max_retries: 3
  error_cooldown: 5.0  # seconds before retry

performance:
  target_latency_ms: 500
  fps_target: 30
  inference_batch_size: 1

ui:
  dashboard_type: "streamlit"  # streamlit, flask, or fastapi
  port: 8501
  debug: false

logging:
  level: "INFO"
  output_dir: "logs"
  max_file_size_mb: 100
