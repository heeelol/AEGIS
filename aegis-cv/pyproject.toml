[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-core"
version = "0.1.0"
description = "AI-Driven Real-Time Procedural Verification System for HMLV Kitting"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "AEGIS Development Team"}
]
keywords = ["computer-vision", "yolov8", "modbus", "edge-ai", "procedural-verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "torch>=2.0.0",
    "pymodbus>=3.4.0",
    "pyyaml>=6.0",
    "streamlit>=1.28.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]
tensorrt = [
    "tensorrt>=8.5.0",
]
jetson = [
    "jetson-stats>=4.0.0",
]

[project.urls]
Repository = "https://github.com/your-org/aegis-core"
Documentation = "https://aegis-core.readthedocs.io"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=html"
