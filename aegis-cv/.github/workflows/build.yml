name: build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate project structure
      run: |
        python -c "
        import os
        required = ['src', 'config', 'scripts', 'tests', 'models', 'docs']
        for d in required:
            assert os.path.isdir(d), f'Missing directory: {d}'
        print('✓ Project structure valid')
        "

    - name: Check core imports
      run: |
        python -c "
        import sys
        try:
            import ultralytics
            import cv2
            import pymodbus
            import yaml
            print('✓ Core dependencies importable')
        except ImportError as e:
            print(f'✗ Import error: {e}')
            sys.exit(1)
        "

    - name: Verify documentation
      run: |
        python -c "
        import os
        docs = ['README.md', 'docs/ARCHITECTURE.md', 'docs/DYNAMIC_BIN_DETECTION.md']
        for doc in docs:
            assert os.path.isfile(doc), f'Missing: {doc}'
        print('✓ Documentation complete')
        "
