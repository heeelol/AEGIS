<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" width="760" height="610" role="img" aria-label="AEGIS kitting finite state machine: IDLE, PICKING, FAULT, KIT_COMPLETE, WAITING_EMPTY, with transitions.">
  <style>
    .bg{fill:#ffffff;}
    .st{fill:#f4f7f6;stroke:#cbd5d1;stroke-width:1.6;}
    .st-fault{fill:#fdecec;stroke:#e34948;}
    .st-done{fill:#e9f7ef;stroke:#2bad6e;}
    .name{font-family:"Cascadia Mono","SF Mono",Consolas,ui-monospace,monospace;font-weight:700;font-size:15px;fill:#14201e;letter-spacing:.5px;}
    .name-fault{fill:#b3261e;} .name-done{fill:#17724a;}
    .sub{font-family:"Segoe UI",system-ui,sans-serif;font-size:10.5px;fill:#5a6b67;}
    .edge{fill:none;stroke:#0c9e88;stroke-width:1.8;}
    .edge-err{stroke:#e34948;}
    .lbl{font-family:"Segoe UI",system-ui,sans-serif;font-size:11px;fill:#5a6b67;}
    .lbl-b{font-weight:600;fill:#14201e;}
    .flist{font-family:"Segoe UI",system-ui,sans-serif;font-size:11px;fill:#5a6b67;}
    .flist-h{font-family:"Cascadia Mono",Consolas,ui-monospace,monospace;font-size:10px;fill:#b3261e;letter-spacing:.5px;}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0c9e88"/>
    </marker>
    <marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e34948"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="760" height="610"/>

  <!-- edges -->
  <path class="edge" d="M280,99 L280,199" marker-end="url(#ar)"/>
  <text class="lbl lbl-b" x="292" y="144">first pick</text>
  <text class="lbl" x="292" y="159">activates a bin</text>

  <path class="edge edge-err" d="M365,221 L483,221" marker-end="url(#ar-r)"/>
  <text class="lbl" x="425" y="214" text-anchor="middle">error detected</text>
  <path class="edge" d="M485,241 L367,241" marker-end="url(#ar)"/>
  <text class="lbl" x="425" y="256" text-anchor="middle">corrected · auto-clear</text>

  <path class="edge" d="M280,259 L280,369" marker-end="url(#ar)"/>
  <text class="lbl lbl-b" x="292" y="307">all required</text>
  <text class="lbl" x="292" y="322">bins banked</text>

  <path class="edge" d="M208,201 C120,168 120,118 251,99" marker-end="url(#ar)"/>
  <text class="lbl lbl-b" x="150" y="140" text-anchor="end">bin done,</text>
  <text class="lbl" x="150" y="155" text-anchor="end">more remain</text>

  <path class="edge" d="M280,429 L280,529" marker-end="url(#ar)"/>
  <text class="lbl" x="292" y="484">prompt to empty</text>

  <path class="edge" d="M195,560 L70,560 L70,70 L193,70" marker-end="url(#ar)"/>
  <text class="lbl" x="135" y="577">kit box emptied + confirmed &#8594; next set</text>

  <!-- nodes -->
  <rect class="st" x="195" y="41" width="170" height="58" rx="11"/>
  <text class="name" x="280" y="70" text-anchor="middle" dominant-baseline="middle">IDLE</text>

  <rect class="st" x="195" y="201" width="170" height="58" rx="11"/>
  <text class="name" x="280" y="224" text-anchor="middle">PICKING</text>
  <text class="sub" x="280" y="244" text-anchor="middle">counts verified placements</text>

  <rect class="st st-fault" x="485" y="201" width="170" height="58" rx="11"/>
  <text class="name name-fault" x="570" y="234" text-anchor="middle" dominant-baseline="middle">FAULT</text>

  <rect class="st st-done" x="195" y="371" width="170" height="58" rx="11"/>
  <text class="name name-done" x="280" y="400" text-anchor="middle" dominant-baseline="middle">KIT_COMPLETE</text>

  <rect class="st" x="195" y="531" width="170" height="58" rx="11"/>
  <text class="name" x="280" y="560" text-anchor="middle" dominant-baseline="middle">WAITING_EMPTY</text>

  <text class="flist-h" x="488" y="291">FAULT TYPES</text>
  <text class="flist" x="488" y="311">&#8226; Overpack</text>
  <text class="flist" x="488" y="329">&#8226; Picked-from-wrong-bin</text>
  <text class="flist" x="488" y="347">&#8226; Returned-to-wrong-bin</text>
  <text class="flist" x="488" y="365">&#8226; Out-of-sequence</text>
</svg>
