# AEGIS v2 — Integration Pipeline Configuration
# ================================================

camera:
  source: 1                   # 0 = default webcam, or video path / RTSP URL
  width: 1280
  height: 720
  fps: 30
  warmup_frames: 30               # frames discarded before the init snapshot so
                                  # exposure/focus settle (USB cams need this; raise
                                  # if the Logitech still detects nothing)
  rotate_180: false                # rotate every frame 180° to match the rig mount

# --- Bin Boundary Detector (from cv-models) ------
bin_detector:
  # Native OBB (oriented bounding box) bin model. Relative paths resolve against
  # the aegis-v2 root, so the pipeline can launch from any working directory.
  model_path: "./cv-models/models/weights/project_9_yolov8_obb_1.pt"
  confidence_threshold: 0.5
  iou_threshold: 0.45
  device: "cpu"                   # "cpu" or "cuda:0"

  # Manual layout override. When set, CV detection is skipped entirely and the
  # bins are laid out as an even grid across the camera frame — one row per
  # layer. You only say HOW MANY bins each layer has; the pixel boxes are
  # computed for you. Each entry is the bin count for that layer (top → bottom).
  # Leave commented (or null) to use the trained model instead.
  #   manual_layout: [4, 3]       # layer 0 → 4 bins, layer 1 → 3 bins
  manual_layout: null

# --- Hand Tracker (from hand-models) -------------
hand_tracker:
  backend: "mediapipe"            # "mediapipe" | "yolo-hand" | your custom backend
  confidence_threshold: 0.5
  max_hands: 2
  grab_threshold_ratio: 1.15
  grab_confirm_frames: 3
  release_confirm_frames: 2

# --- Bin Assignment Engine -----------------------
bin_assignment:
  method: "finger_vote"           # "point_in_polygon" | "nearest_centroid" | "area_overlap" | "finger_vote"
  hand_keypoint: "index_tip"      # Which landmark to use as the "reaching" point
  overlap_threshold: 0.5          # Min overlap ratio for area_overlap method
                                  # ratio = (hand_box ∩ bin_box) / full_hand_box_area,
                                  # i.e. fraction of the hand bbox inside the bin

  # Finger-vote method (set method: "finger_vote" above to use it). The index
  # and middle fingertips each vote for the bin they fall in; agreement (or a
  # single inside tip) wins, a split is broken by deepest penetration (the tip
  # planted furthest from a bin edge), and if neither tip is inside a bin their
  # centroid is used. Tips below the confidence floor or off-frame are ignored.
  # Index + middle is the human tripod-pick set; do not add ring/pinky (they
  # flail in precision picks and add false cross-bin votes).
  vote_keypoints: [index_tip, middle_tip]
  vote_confidence_floor: 0.5

  # Occlusion gate: when a hand reaches into a BOTTOM bin, the shelf lip hides the
  # fingers and MediaPipe extrapolates the fingertip — sometimes into a TOP bin,
  # producing a false top-bin hit. The gate detects this (knuckle anchor — MCP
  # centroid, wrist as fallback — at/below the bottom-bin rim) and reassigns to
  # the bottom bin beneath. The knuckles (not the wrist) decide, so a genuine
  # reach OVER the lip into a top bin, with the wrist trailing low, stays on the
  # top bin. Off → assign() behaves exactly as before.
  occlusion_gate:
    enabled: true
    # Foreground-evidence mode (recommended for a fixed camera + stable scene).
    # When present, a top-bin hit is confirmed against real foreground at the
    # fingertip: a hand occluded under the shelf leaves no foreground up top, so
    # the hit is reassigned to the bin below. Until the model has warmed up, the
    # gate falls back to its landmark heuristic. Remove this block to use the
    # landmark heuristic only. See docs/superpowers/specs/2026-06-22-foreground-occlusion-gate-design.md
    foreground:
      present_ratio: 0.20   # min foreground fraction in the fingertip patch for a real hand
      patch_size: 41        # px window around the claimed fingertip
      warmup_frames: 30     # frames before the model is trusted
      history: 500          # MOG2 history
      var_threshold: 16     # MOG2 variance threshold

  # Occlusion hold: keeps a BOTTOM bin highlighted while the hand that was picking
  # from it is hidden under the shelf (visual continuity only — no count effect).
  # The last assignment taken while the hand was still visible is frozen and held;
  # a phantom extrapolated hand does NOT release it — only a genuinely visible hand
  # (foreground returns) does. occlusion_ratio is a SEPARATE, stricter floor than
  # the gate's present_ratio: a fingertip is "occluded" only when its foreground
  # fraction is below it (truly under the shelf), so a weakly-visible real hand is
  # not falsely frozen. See docs/superpowers/specs/2026-06-22-present-ratio-occlusion-hold-design.md
  occlusion_hold:
    enabled: true
    occlusion_ratio: 0.05   # fingertip foreground floor; below = occluded (latch/release)
    occupancy_ratio: 0.05   # bottom-bin foreground floor; the hold releases once the
                            # bin region falls below it (the forearm left the bin)

# --- Work Order (target pick counts) -------------
# Predetermined target quantity for each bin, shown in the dashboard as
# "current / target" (e.g. 2/5). Structure mirrors bin_detector.manual_layout:
# one inner list per layer (top → bottom), one number per bin (left → right).
# A bin with no entry (or 0) is treated as not part of the job and shows just
# the live count with no target. Leave commented to disable targets entirely.
work_order:
  targets:
    - [5, 0, 5, 5, 0, 5]   # layer 0 (top) → 6 bins; 0 = not part of the job
    - [3, 3, 3]            # layer 1 (bottom) → 3 bins

# --- Sensing (future: Modbus / Serial) -----------
sensing:
  modbus:
    enabled: false
    ip_address: "192.168.1.100"
    port: 502
    slave_id: 1
  serial:
    enabled: false
    port: "COM3"
    baudrate: 115200
  # Load-cell array — per-bin weights streamed from an ESP32 over USB serial
  # as newline-delimited JSON: {"bins": {"bin_0_0": 123.4, ...}} in grams.
  # While disabled (or the port can't be opened) the dashboard layout comes
  # from CV detection only and no weights are shown.
  loadcells:
    enabled: true
    port: "COM5"           # Silicon Labs CP210x (ESP32) — driver installed 2026-06-17
    baudrate: 115200
    stale_after: 5.0       # seconds without data → treated as disconnected
    # Firmware labels its single cell "bin_0_0"; this cell is physically bin_0_5.
    # Renamed at the reader before caching, so everything downstream sees bin_0_5.
    bin_remap:
      bin_0_0: bin_0_5

# --- OpenCV Camera Overlay -----------------------
ui:
  enabled: true
  show_bin_boundaries: true
  show_hand_landmarks: true
  highlight_active_bin: true
  overlay_alpha: 0.35
  show_fps: true

# --- Web Dashboard (FastAPI) ---------------------
dashboard:
  enabled: true
  port: 8080                      # http://localhost:8080
  open_browser: true              # auto-open the UI in the default browser on run

# --- Debug ---------------------------------------
debug:
  show_init_snapshot: false

# --- Logging -------------------------------------
logging:
  level: "INFO"
