# AEGIS v2 — Integration Pipeline Configuration
# ================================================

camera:
  source: 1                       # 0 = default webcam, or video path / RTSP URL
  width: 1280
  height: 720
  fps: 30
  warmup_frames: 30               # frames discarded before a snapshot so exposure/
                                  # focus settle (USB cams need this; raise if the
                                  # Logitech still detects nothing)
  rotate_180: true                # rotate every frame 180° to match the rig mounting
                                  # (set false if the camera is mounted right-side up)

# --- Bin Boundary Detector (native OBB) ----------
# Two-snapshot grid flow (see docs/superpowers/specs/2026-06-15-...):
#   key 1 = workstation grid calibration (all 9 bins in view)
#   key 2 = kit initialisation (occupancy: which bins are present)
bin_detector:
  model_path: "./cv-models/models/weights/project_9_yolov8_obb_1.pt"   # YOLOv8-OBB weights
  confidence_threshold: 0.5
  iou_threshold: 0.45
  device: "cpu"                   # "cpu" or "cuda:0"

  # Manual layout override. When set, CV detection is skipped entirely and the
  # bins are laid out as an even grid across the camera frame — one row per
  # layer. You only say HOW MANY bins each layer has; the pixel boxes are
  # computed for you. Each entry is the bin count for that layer (top → bottom).
  # Leave commented (or null) to use the trained model instead.
  #   manual_layout: [4, 3]       # layer 0 → 4 bins, layer 1 → 3 bins
  manual_layout: null

# --- Hand Tracker (from hand-models) -------------
hand_tracker:
  backend: "mediapipe"            # "mediapipe" | "yolo-hand" | your custom backend
  confidence_threshold: 0.5
  max_hands: 2

# --- Bin Assignment Engine -----------------------
# Decides which bin a hand is hovering. The dashboard then signals passively:
# the hovered bin lights up as the right bin (in the work order) or the wrong
# bin (not in it). No grab gesture or kinetic gating is involved.
bin_assignment:
  method: "point_in_polygon"      # "point_in_polygon" | "nearest_centroid" | "area_overlap"
  hand_keypoint: "index_tip"      # Which landmark to use as the "reaching" point
  overlap_threshold: 0.3          # Min overlap ratio for area_overlap method

  # Occlusion gate. MediaPipe extrapolates occluded fingertips, so a hand
  # reaching into a BOTTOM bin (fingers hidden under the top-shelf lip) can have
  # its index_tip hallucinated into a TOP bin. The gate detects this — fingertip
  # in a top bin but the hand's proximal anchor (wrist, else knuckles) at/below
  # the bottom bin's cut-off rim — and reassigns the hit to the bottom bin
  # beneath (or suppresses it when there is no bottom bin under the hand).
  occlusion_gate:
    enabled: true                 # off → assignment behaves exactly as before

# --- Occlusion Hold ------------------------------
# Keeps a bottom-layer bin marked active while the picking hand is hidden under
# the rack lip. Without this, the bin de-activates the instant the hand tracker
# loses sight of the hand. A hold ends only when that hand (by handedness) is
# seen again — there is no timeout, so a bin can stay lit if the operator walks
# away (clear it from the dashboard if needed).
occlusion_hold:
  enabled: true
  eligible_rows: null   # null = auto-detect bottom row; or e.g. [2] for explicit rows

# --- Work Order (target pick counts) -------------
# Predetermined target quantity for each bin, shown in the dashboard as
# "current / target" (e.g. 2/5). Structure mirrors bin_detector.manual_layout:
# one inner list per layer (top → bottom), one number per bin (left → right).
# A bin with no entry (or 0) is treated as not part of the job and shows just
# the live count with no target. Leave commented to disable targets entirely.
work_order:
  targets:
    - [5, 0, 5, 5, 0, 2]   # layer 0 (top) → 6 single-slot bins
    - [3, 3, 3]            # layer 1 (bottom) → 3 double-slot bins

# --- Sensing (future: Modbus / Serial) -----------
sensing:
  modbus:
    enabled: false
    ip_address: "192.168.1.100"
    port: 502
    slave_id: 1
  serial:
    enabled: false
    port: "COM3"
    baudrate: 115200
  # Load-cell array — per-bin weights streamed from an ESP32 over USB serial
  # as newline-delimited JSON: {"bins": {"bin_0_0": 123.4, ...}} in grams.
  # While disabled (or the port can't be opened) the dashboard layout comes
  # from CV detection only and no weights are shown.
  loadcells:
    enabled: false
    port: "/dev/ttyUSB0"   # ESP32 USB device (Windows: "COM3")
    baudrate: 115200
    stale_after: 5.0       # seconds without data → treated as disconnected

# --- OpenCV Camera Overlay -----------------------
ui:
  enabled: true
  show_bin_boundaries: true
  show_hand_landmarks: true
  highlight_active_bin: true
  overlay_alpha: 0.35
  show_fps: true

# --- Web Dashboard (FastAPI) ---------------------
dashboard:
  enabled: true
  port: 8080                      # http://localhost:8080

# --- Debug ---------------------------------------
debug:
  show_init_snapshot: false

# --- Logging -------------------------------------
logging:
  level: "INFO"
