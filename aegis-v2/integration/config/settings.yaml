# AEGIS v2 — Integration Pipeline Configuration
# ================================================

camera:
  source: 0                       # 0 = default webcam, or video path / RTSP URL
  width: 1280
  height: 720
  fps: 30

# --- Bin Boundary Detector (from cv-models) ------
bin_detector:
  model_path: "./cv-models/models/weights/best.pt"   # Trained YOLOv8-seg weights
  confidence_threshold: 0.5
  iou_threshold: 0.45
  device: "cpu"                   # "cpu" or "cuda:0"

  # Manual layout override. When set, CV detection is skipped entirely and the
  # bins are laid out as an even grid across the camera frame — one row per
  # layer. You only say HOW MANY bins each layer has; the pixel boxes are
  # computed for you. Each entry is the bin count for that layer (top → bottom).
  # Leave commented (or null) to use the trained model instead.
  #   manual_layout: [4, 3]       # layer 0 → 4 bins, layer 1 → 3 bins
  manual_layout: [4,3]

# --- Hand Tracker (from hand-models) -------------
hand_tracker:
  backend: "mediapipe"            # "mediapipe" | "yolo-hand" | your custom backend
  confidence_threshold: 0.5
  max_hands: 2
  grab_threshold_ratio: 1.15
  grab_confirm_frames: 3
  release_confirm_frames: 2

# --- Bin Assignment Engine -----------------------
bin_assignment:
  method: "point_in_polygon"      # "point_in_polygon" | "nearest_centroid" | "area_overlap"
  hand_keypoint: "index_tip"      # Which landmark to use as the "reaching" point
  overlap_threshold: 0.3          # Min overlap ratio for area_overlap method

# --- Work Order (target pick counts) -------------
# Predetermined target quantity for each bin, shown in the dashboard as
# "current / target" (e.g. 2/5). Structure mirrors bin_detector.manual_layout:
# one inner list per layer (top → bottom), one number per bin (left → right).
# A bin with no entry (or 0) is treated as not part of the job and shows just
# the live count with no target. Leave commented to disable targets entirely.
work_order:
  targets:
    - [5, 0, 5, 5]   # layer 0 → 4 bins
    - [3, 3, 3]      # layer 1 → 3 bins

# --- Triple-Gate FSM (Kinetic Gating) ------------
fsm:
  gate1_spatial_timeout: 2.0      # seconds — hand must stay in bin
  gate2_intent_timeout: 1.5       # seconds — grab gesture detection window
  gate3_verification_timeout: 3.0 # seconds — weight confirmation window
  weight_delta_threshold: 50      # grams — minimum change to confirm pick/place
  error_cooldown: 5.0             # seconds before retry after failure
  max_retries: 3

# --- Sensing (future: Modbus / Serial) -----------
sensing:
  modbus:
    enabled: false
    ip_address: "192.168.1.100"
    port: 502
    slave_id: 1
  serial:
    enabled: false
    port: "COM3"
    baudrate: 115200
  # Load-cell array — per-bin weights streamed from an ESP32 over USB serial
  # as newline-delimited JSON: {"bins": {"bin_0_0": 123.4, ...}} in grams.
  # While disabled (or the port can't be opened) the dashboard layout comes
  # from CV detection only and no weights are shown.
  loadcells:
    enabled: true 
    port: "/dev/ttyUSB0"   # ESP32 USB device (Windows: "COM3")
    baudrate: 115200
    stale_after: 5.0       # seconds without data → treated as disconnected

# --- OpenCV Camera Overlay -----------------------
ui:
  enabled: true
  show_bin_boundaries: true
  show_hand_landmarks: true
  highlight_active_bin: true
  overlay_alpha: 0.35
  show_fps: true

# --- Web Dashboard (FastAPI) ---------------------
dashboard:
  enabled: true
  port: 8080                      # http://localhost:8080

# --- Debug ---------------------------------------
debug:
  show_init_snapshot: false

# --- Logging -------------------------------------
logging:
  level: "INFO"
