  #     bin_1_2: 1
  



# --- Sensing (future: Modbus / Serial) -----------
sensing:
  modbus:
    enabled: false
    ip_address: "192.168.1.100"
    port: 502
    slave_id: 1
  serial:
    enabled: false
    port: "COM3"
    baudrate: 115200
  # Load-cell array — per-bin weights streamed from an ESP32 over USB serial
  # as newline-delimited JSON: {"bins": {"bin_0_0": 123.4, ...}} in grams.
  # While disabled (or the port can't be opened) the dashboard layout comes
  # from CV detection only and no weights are shown.
  loadcells:
    enabled: true
    port: "COM3"           # Silicon Labs CP210x (ESP32) — enumerated as COM3 (2026-06-24)
    baudrate: 115200
    stale_after: 5.0       # seconds without data → treated as disconnected
    # Recalibrated firmware (esp32/3cell1hx/3cell1hx.ino) emits bin_1..bin_10;
    # remap to the canonical grid ids + kit box (operator mapping, 2026-06-30).
    bin_remap:
      bin_1:  bin_1_1
      bin_2:  bin_1_2
      bin_3:  bin_1_0    # BOM bin
      bin_5:  bin_0_3
      bin_7:  bin_0_0
      bin_8:  bin_0_1    # BOM bin
      bin_10: kit_box    # kitting box
      bin_4:  bin_0_5    # BOM bin
      bin_6:  bin_0_4    # BOM bin — newly wired; scale=1 (uncalibrated) until calibrate() is run
      bin_9:  bin_0_2    # newly wired; scale=1 (uncalibrated) until calibrate() is run
    # Kitting box = the 4th load receptor (separate 5 kg cell, off-camera).
    # SEQUENTIAL single-bin FSM: one bin is active at a time, so the box's weight
    # change can only come from that item type (no cross-bin ambiguity). The active
    # bin's count = round((box − banked_baseline) / unit). See sensing/placement.py
    # and docs/superpowers/specs/2026-06-25-sequential-single-bin-kitting-fsm.md.
    kit_box:
      box_id: kit_box
      activation_frac: 0.5        # a bin goes ACTIVE once it drops ≥ this fraction of an item
      wrong_bin_frac: 0.5         # (currently unused — superseded by the hysteretic
                                  #  per-bin added/removed counts driving the wrong-bin faults)
      box_step_tolerance_g: 1.8   # noise floor (grams) for the box-baseline stability gate:
                                  # while idle, the tracked baseline only re-anchors to the
                                  # smoothed box reading once it's settled within this of the
                                  # raw reading (see placement.py's continuous-tracking comment)
      ema_alpha: 0.4              # weight smoothing: higher = snappier, lower = smoother
      hysteresis: 0.05            # anti-flicker deadband (fraction of an item)
      # box_hysteresis: 0.05      # SAME deadband, but only for box-crediting (placed) —
      #   defaults to `hysteresis` above if unset. The kit box is a physically
      #   different, coarser (higher-capacity) load cell than the individual bin
      #   cells, so its own noise floor in grams need not match theirs. If light
      #   items register correctly in their own bin (removed) but unreliably in
      #   the box (placed doesn't increase, or increases inconsistently), lower
      #   this independently of `hysteresis` — changing that would also affect
      #   the bin cells' own, already-reliable removed/added counting.
      # count_tolerance_g: 0.3    # absolute-gram floor for pick/place count rounding
      #   (removed/added/placed). hysteresis alone is a % of unit weight, which
      #   shrinks to near-nothing for light items (e.g. TE parts, 0.05*3.6g=0.18g) —
      #   below real scale noise/item-weight variance. Deliberately independent of
      #   box_step_tolerance_g above (a different, box-level concern).
      #   Uncomment to tune; defaults to 0.3g if left unset.
      fault_settle_s: 2.5         # grace period after every tare (boot, empty-box confirm,
                                  # cycle restart) before wrong-bin/overpack faults can fire —
                                  # gives per-bin readings a moment to settle from a fresh
                                  # zero so residual convergence doesn't read as a real event
      activation_confirm_s: 0.4   # a bin only becomes ACTIVE once it's been the leading
                                  # candidate continuously for this long — a single noisy
                                  # frame crossing activation_frac used to focus a bin
                                  # instantly with zero real hand interaction. Restarts if
                                  # the candidate changes or drops back below threshold; a
                                  # real reach clears it easily, so this isn't a delay on
                                  # legitimate picks
                                  # Wrong-bin detection itself now filters cross-talk
                                  # directly (per-bin steady-state + matching against
                                  # what's actually in-hand, see placement.py) instead of
                                  # a generic time-based debounce — fault_confirm_s has
                                  # been retired.

# --- OpenCV Camera Overlay -----------------------
ui:
  enabled: true
  show_bin_boundaries: true
  show_hand_landmarks: true
  highlight_active_bin: true
  overlay_alpha: 0.35
  show_fps: true

# --- Web Dashboard (FastAPI) ---------------------
dashboard:
  enabled: true
  port: 8080                      # http://localhost:8080
  open_browser: true              # auto-open the UI in the default browser on run

# --- Debug ---------------------------------------
debug:
  show_init_snapshot: false

# --- Logging -------------------------------------
logging:
  level: "INFO"
