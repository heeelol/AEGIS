# Inventory map — one item type per bin.
#
# The load cell is tared with the bins FULL at startup, so each bin's live
# weight is the signed change from full: it goes negative as items are removed.
# So for a bin holding an item of unit weight `unit_g`:
#     items_taken = round(-weight / unit_g)      # clamped at >= 0
#
# Edit unit weights and bin assignments here; nothing about counts is needed.

items:
  # item_name: { unit_g: <grams per single item> }
  pcb_pipe: { unit_g: 130.5 }
  copper_rod: { unit_g: 23.9 }
  te_completed_part: { unit_g: 12.5 }
  te_uncompleted_part: { unit_g: 3.6 }
  m6_cross_screw: { unit_g: 3.2 }
  shelf_bracket: { unit_g: 5.1 }
  bin_sup_big: { unit_g: 15.1 }
  bin_sup_med: { unit_g: 9.8 }


bins:
  # bin_id: item_name   (bin_id matches the load-cell keys, e.g. bin_0_0)
  bin_0_0: d-3200
  bin_0_1: screw_m6
  bin_1_0: ext_brack
