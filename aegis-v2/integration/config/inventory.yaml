# Inventory map — one item type per bin.
#
# The load cell is tared with the bins FULL at startup, so each bin's live
# weight is the signed change from full: it goes negative as items are removed.
# So for a bin holding an item of unit weight `unit_g`:
#     items_taken = round(-weight / unit_g)      # clamped at >= 0
#
# Edit unit weights and bin assignments here; nothing about counts is needed.

items:
  # item_name: { unit_g: <grams per single item> }
  bolt_m6:   { unit_g: 13.9 }
  washer_m6: { unit_g: 1.1 }
  amp:       { unit_g: 3.8 }   # one AMP = 3.8 g (confirmed live 2026-06-17)
  # Kitting demo items (one per BOM source bin). Per-bin removal is measured by
  # each bin's OWN load cell, so near-equal weights (3.6 vs 3.1) still attribute
  # correctly; the box weight confirms placement and total.
  part_p04:  { unit_g: 3.6 }   # bin_0_4 (1 kg receptor)
  part_p05:  { unit_g: 3.1 }   # bin_0_5 (5 kg receptor)
  part_p12:  { unit_g: 67.1 }  # bin_1_2 (10 kg receptor)

bins:
  # bin_id: item_name   (bin_id matches the load-cell keys, AFTER bin_remap)
  # --- Kitting demo: 3 BOM source bins (each on its own load receptor) ---
  bin_0_4: part_p04
  bin_0_5: part_p05
  bin_1_2: part_p12
  # The kitting box (kit_box) is a SEPARATE 4th receptor (off-camera); it is NOT
  # an item bin — configured under sensing.loadcells.kit_box in settings.yaml.
