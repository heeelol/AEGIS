<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEGIS — Kitting Operator</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="console">

    <!-- Status rail -->
    <header>
      <div class="header-left">
        <h1>AEGIS<span class="mark">//</span>KIT</h1>
        <span class="subtitle">Operator · Kitting</span>
      </div>
      <div class="header-right">
        <div id="set-progress" class="stat-chip set-chip hidden">SET — / —</div>
        <div id="fps-display" class="stat-chip">— FPS</div>
        <div id="last-updated" class="stat-chip link">Linking…</div>
      </div>
    </header>

    <!-- Sets-remaining progress bar: fills as completed sets accrue. -->
    <div id="set-progress-bar" class="set-progress-bar hidden"><span id="set-progress-fill"></span></div>

    <!-- Bins (the whole story) -->
    <div class="workspace">
      <section class="bins-zone">
        <h2>Bins</h2>
        <div id="bins"></div>
      </section>
    </div>

  </div>

  <!-- Full-screen red fault banner: a big keyword (from the fault type) + the
       corrective action as a subtitle, plus the specific bin to act on. Covers
       overpack-kit, pick-from-wrong-bin, return-to-wrong-bin, out-of-sequence. -->
  <div id="alert-overlay" class="alert-overlay hidden">
    <div class="alert-box">
      <div class="alert-icon">⚠</div>
      <div class="alert-main">
        <div id="alert-keyword" class="alert-keyword"></div>
        <div id="alert-sub" class="alert-sub"></div>
      </div>
      <div id="alert-bin" class="alert-bin hidden"></div>
    </div>
  </div>

  <!-- Empty-kitting-box confirmation: shown automatically once every bin is green
       (no separate Complete button). Operator empties the box by hand and confirms —
       no automatic weight check. -->
  <div id="empty-box-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-title">Empty the kitting box</div>
      <div class="modal-body">Remove all items from the kitting box, then confirm to start the next set.</div>
      <div class="modal-actions">
        <button id="empty-box-confirm" class="modal-btn proceed">Confirm — start next set</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
