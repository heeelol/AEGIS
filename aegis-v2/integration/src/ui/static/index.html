<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEGIS — Kitting Operator</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="console">

    <!-- Status rail -->
    <header>
      <div class="header-left">
        <h1>AEGIS<span class="mark">//</span>KIT</h1>
        <span class="subtitle">Operator · Kitting</span>
      </div>
      <div class="header-right">
        <div id="fps-display" class="stat-chip">— FPS</div>
        <div id="last-updated" class="stat-chip link">Linking…</div>
      </div>
    </header>

    <!-- Bins (the whole story) -->
    <div class="workspace">
      <section class="bins-zone">
        <h2>Bins</h2>
        <div id="bins"></div>
      </section>
    </div>

    <!-- Status bar: one instruction + the Complete button (appears when ready) -->
    <div id="statusbar" class="statusbar">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-msg">Waiting for calibration…</span>
      <button id="complete-btn" class="complete-btn hidden">Complete kit</button>
    </div>

  </div>

  <!-- Complete-kit confirmation -->
  <div id="confirm-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-title">Complete this kit?</div>
      <div class="modal-body">Every bin is verified. Closing the kit logs it and clears the station for the next one.</div>
      <div class="modal-actions">
        <button id="confirm-cancel" class="modal-btn cancel">Cancel</button>
        <button id="confirm-proceed" class="modal-btn proceed">Proceed</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
