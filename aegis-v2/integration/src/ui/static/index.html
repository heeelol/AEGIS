<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEGIS v2 — Operator Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header>
    <div class="header-left">
      <h1>AEGIS v2</h1>
      <span class="subtitle">Bin Tracker &amp; Kinetic Gating</span>
    </div>
    <div class="header-right">
      <div id="fps-display" class="stat-chip">— FPS</div>
      <div id="last-updated" class="stat-chip">Connecting...</div>
    </div>
  </header>

  <!-- Bin Grid -->
  <section id="bins-section">
    <h2>Bins</h2>
    <main id="bins"></main>
  </section>

  <!-- Hand Tracking Status -->
  <section id="hands-section">
    <h2>Hand Tracking</h2>
    <div id="hands"></div>
  </section>

  <!-- System Stats -->
  <section id="stats-section">
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-label">Frames</div>
        <div class="stat-value" id="stat-frames">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Uptime</div>
        <div class="stat-value" id="stat-uptime">0s</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Bins</div>
        <div class="stat-value" id="stat-bins">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Hands</div>
        <div class="stat-value" id="stat-hands">0</div>
      </div>
    </div>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
